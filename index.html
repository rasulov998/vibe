<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090d"><title>VIBE 2.0</title><link rel="stylesheet" href="style.css?v=4"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js?v=3"></script></head><body><div class="app-shell"><aside class="side-panel"><div class="brand"><span>V</span>IBE <b>2.0</b></div><p class="tagline">Смотри. Вдохновляйся.<br>Будь в <strong>VIBE.</strong></p><nav><button class="nav-item active" data-tab="home">⌂ <div><b>Главная</b><small>Лента</small></div></button><button class="nav-item" data-tab="explore">◈ <div><b>Интересное</b><small>Тренды</small></div></button><button class="nav-item" data-tab="create">＋ <div><b>Создать</b><small>Фото и видео</small></div></button><button class="nav-item" id="chatNav">💬 <div><b>Чаты</b><small>Сообщения</small></div></button><button class="nav-item" data-tab="profile">♙ <div><b>Профиль</b><small>Мой аккаунт</small></div></button></nav></aside><main class="main"><header class="topbar"><div class="mobile-brand"><span>V</span>IBE <em>2.0</em></div><div class="search"><span>⌕</span><input id="searchInput" placeholder="Поиск видео, пользователей…"></div><button class="avatar">R</button></header><section class="feed"><div class="tabs"><button class="tab active">Для тебя</button><button class="tab">Подписки</button><button class="tab">Тренды</button></div><div id="uploadPanel" class="upload-panel" style="display:none"><h2>Создать публикацию</h2><input id="mediaFile" type="file" accept="image/*,video/*"><textarea id="mediaCaption" placeholder="Что хочешь сказать?"></textarea><button id="uploadBtn" class="primary">Опубликовать</button><div id="uploadStatus"></div></div><div id="realFeed"></div></section></main><aside class="right-panel"><section class="panel-card profile-card"><div class="cover"></div><div class="profile-avatar">V</div><h3>VIBE</h3><p>Твоя атмосфера. Твои видео.</p><button class="primary" id="sideProfileBtn">Мой профиль</button><button class="secondary social-chat-open">💬 Открыть чаты</button></section></aside><nav class="bottom-nav"><button class="active" data-tab="home">⌂<small>Главная</small></button><button data-tab="explore">◈<small>Интересное</small></button><button class="create" data-tab="create">＋</button><button class="chat-bottom social-chat-open">💬<small>Чаты</small></button><button data-tab="profile">♙<small>Профиль</small></button></nav></div><div class="profile-modal" id="profileModal" aria-hidden="true"><div class="profile-backdrop" data-close-profile></div><section class="profile-page"><button class="profile-close" data-close-profile>×</button><div class="profile-cover" id="profileCover"></div><div class="profile-head"><div class="profile-main-avatar" id="profileAvatar">R</div><div class="profile-identity"><h2 id="profileUsername">@username</h2><p id="profileDisplayName">VIBE user</p></div></div><p class="profile-bio" id="profileBio">Добавь описание профиля.</p><div class="profile-stats"><button><b id="profilePostsCount">0</b><span>Посты</span></button><button><b id="profileFollowersCount">0</b><span>Подписчики</span></button><button><b id="profileFollowingCount">0</b><span>Подписки</span></button></div><div class="story-row"><div class="story-add" id="storyAdd"><span>＋</span><small>История</small></div><div id="storyList"></div></div><div class="profile-tabs"><button class="active" data-profile-tab="posts">▦ Посты</button><button data-profile-tab="stories">◉ Истории</button><button data-profile-tab="actual">✦ Актуальное</button></div><div id="profileContent" class="profile-grid"></div></section></div><div class="auth-modal" id="authModal" aria-hidden="true"><div class="auth-backdrop" data-close-auth></div><section class="auth-card"><button class="auth-close" data-close-auth>×</button><div class="auth-logo"><span>V</span>IBE <b>2.0</b></div><h2>Войти в VIBE</h2><p class="auth-subtitle">Используй свой аккаунт</p><form id="authForm"><label class="auth-field">Email<input id="authEmail" type="email" autocomplete="email" required></label><label class="auth-field">Пароль<input id="authPassword" type="password" minlength="6" autocomplete="current-password" required></label><button class="auth-submit" type="submit">Войти</button></form><p class="auth-register-text">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p></section></div><div class="toast" id="toast"></div><script src="app.js?v=9"></script><script src="profile-user.js?v=4"></script><script src="social.js?v=2"></script><script src="story-plus.js?v=1"></script></body></html>
