<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09090d">
  <title>VIBE 2.0 — Регистрация</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#09090d;color:#f7f7fb;font-family:Inter,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
    .wrap{width:100%;max-width:460px}
    .logo{text-align:center;font-size:30px;font-weight:900;margin-bottom:28px;letter-spacing:-1px}
    .logo span{display:inline-flex;width:42px;height:42px;border-radius:14px;align-items:center;justify-content:center;background:linear-gradient(135deg,#8b35ff,#3b82f6);margin-right:8px}
    .logo b{font-size:13px;color:#a875ff;margin-left:5px}
    .card{background:#111119;border:1px solid #292938;border-radius:24px;padding:30px;box-shadow:0 20px 60px #0008}
    h1{font-size:30px;margin:0 0 8px}
    .sub{color:#a8a8b7;margin:0 0 24px;line-height:1.5}
    label{display:block;font-size:14px;font-weight:700;margin:16px 0 7px}
    input{width:100%;padding:14px 15px;border-radius:12px;border:1px solid #353545;background:#0b0b11;color:#fff;outline:none;font-size:16px}
    input:focus{border-color:#8b35ff;box-shadow:0 0 0 3px #8b35ff22}
    button{width:100%;margin-top:22px;border:0;border-radius:13px;padding:14px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,#8b35ff,#3b82f6);cursor:pointer}
    .back{text-align:center;margin-top:20px;color:#aaaabc;font-size:14px}
    .back a{color:#a875ff;text-decoration:none;font-weight:700}
    .note{font-size:12px;color:#777789;text-align:center;margin-top:16px;line-height:1.5}
    #message{min-height:20px;color:#ff6b81;text-align:center;margin-top:14px;font-size:14px}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="logo"><span>V</span>IBE <b>2.0</b></div>
    <section class="card">
      <h1>Создать аккаунт</h1>
      <p class="sub">Зарегистрируйся в VIBE, чтобы продолжить.</p>
      <form id="registerForm">
        <label for="username">Имя пользователя</label>
        <input id="username" autocomplete="username" placeholder="rasulov998" minlength="3" required>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label for="password">Пароль</label>
        <input id="password" type="password" autocomplete="new-password" placeholder="Минимум 6 символов" minlength="6" required>
        <label for="confirm">Подтвердите пароль</label>
        <input id="confirm" type="password" autocomplete="new-password" placeholder="Повторите пароль" minlength="6" required>
        <button type="submit">Зарегистрироваться</button>
      </form>
      <div id="message"></div>
      <div class="back">Уже есть аккаунт? <a href="index.html?login=1">Войти</a></div>
      <div class="note">Демо-авторизация: данные сохраняются только в этом браузере.</div>
    </section>
  </main>
  <script>
    const form=document.getElementById('registerForm');
    const message=document.getElementById('message');
    form.addEventListener('submit',e=>{
      e.preventDefault();
      const username=document.getElementById('username').value.trim();
      const email=document.getElementById('email').value.trim().toLowerCase();
      const password=document.getElementById('password').value;
      const confirm=document.getElementById('confirm').value;
      if(username.length<3)return message.textContent='Имя пользователя: минимум 3 символа.';
      if(password.length<6)return message.textContent='Пароль должен быть не менее 6 символов.';
      if(password!==confirm)return message.textContent='Пароли не совпадают.';
      localStorage.setItem('vibeUser',JSON.stringify({username,email,password}));
      window.location.href='index.html?registered=1';
    });
  </script>
</body>
</html>
