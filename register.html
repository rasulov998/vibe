<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIBE 2.0 — Регистрация</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#09090d;color:#fff;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:18px}.wrap{width:min(460px,100%)}.logo{text-align:center;font-size:30px;font-weight:900;margin-bottom:22px}.logo span{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#8b35ff,#3b82f6);margin-right:7px}.logo b{font-size:12px;color:#a875ff}.card{background:#111119;border:1px solid #292938;border-radius:24px;padding:28px;box-shadow:0 20px 60px #0008}h1{margin:0 0 8px}.sub{color:#a8a8b7;line-height:1.5;margin-bottom:20px}label{display:block;font-size:13px;font-weight:800;margin:13px 0 7px}input{width:100%;padding:14px;border-radius:12px;border:1px solid #353545;background:#0b0b11;color:#fff;outline:0;font-size:16px}button{width:100%;margin-top:20px;border:0;border-radius:13px;padding:14px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,#8b35ff,#3b82f6)}#message{text-align:center;min-height:22px;margin-top:14px;color:#ff7b8d;font-size:14px}.back{text-align:center;margin-top:18px;color:#aaaabc;font-size:14px}.back a{color:#a875ff;font-weight:800}.note{text-align:center;color:#777789;font-size:12px;margin-top:14px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js?v=2"></script></head><body><main class="wrap"><div class="logo"><span>V</span>IBE <b>2.0</b></div><section class="card"><h1>Создать аккаунт</h1><p class="sub">Регистрация в VIBE занимает несколько секунд.</p><form id="registerForm"><label>Имя пользователя</label><input id="username" autocomplete="username" minlength="3" required placeholder="rasulov998"><label>Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><label>Пароль</label><input id="password" type="password" autocomplete="new-password" minlength="6" required placeholder="Минимум 6 символов"><label>Повторите пароль</label><input id="confirm" type="password" autocomplete="new-password" minlength="6" required placeholder="Повторите пароль"><button id="submit" type="submit">Зарегистрироваться</button></form><div id="message"></div><div class="back">Уже есть аккаунт? <a href="index.html?login=1">Войти</a></div><div class="note">Supabase Auth + реальный аккаунт VIBE</div></section></main><script>const f=document.getElementById('registerForm'),m=document.getElementById('message'),btn=document.getElementById('submit');f.onsubmit=async e=>{e.preventDefault();const username=document.getElementById('username').value.trim(),email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(username.length<3)return m.textContent='Имя пользователя — минимум 3 символа.';if(password.length<6)return m.textContent='Пароль — минимум 6 символов.';if(password!==confirm)return m.textContent='Пароли не совпадают.';btn.disabled=true;btn.textContent='Создание аккаунта…';m.textContent='';try{const r=await vibeSupabase.auth.signUp({email,password,options:{data:{username,display_name:username}}});if(r.error)throw r.error;if(r.data.user){await vibeSupabase.from('profiles').upsert({id:r.data.user.id,username,display_name:username},{onConflict:'id'})}if(r.data.session){location.href='index.html?registered=1'}else{m.style.color='#7ee787';m.textContent='Аккаунт создан. Проверь Email и затем войди.'}}catch(err){m.textContent=err.message||'Ошибка регистрации'}finally{btn.disabled=false;btn.textContent='Зарегистрироваться'}};</script></body></html>
