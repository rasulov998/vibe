<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIBE Telegram Manager</title><style>body{margin:0;background:#090b12;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.card{width:min(460px,calc(100% - 32px));background:#111522;border:1px solid #272d40;border-radius:22px;padding:24px;box-sizing:border-box;box-shadow:0 20px 70px #0008}h1{margin:0 0 8px}.muted{color:#9ca3b5}.row{margin:18px 0}.label{display:block;margin-bottom:8px}input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #30374d;background:#0a0d15;color:#fff;font-size:15px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#fff;color:#111;font-weight:700;font-size:15px;margin-top:10px}.status{margin-top:16px;padding:12px;border-radius:12px;background:#0b0f19;color:#cbd5e1}.warning{font-size:13px;color:#fbbf24;line-height:1.45}.brand{font-weight:800;letter-spacing:.5px;margin-bottom:18px}</style></head><body><main class="card"><div class="brand">VIBE • TELEGRAM MANAGER</div><h1>Подключение бота</h1><p class="muted">@VibeMedia_TJBot</p><div class="row"><label class="label" for="token">Bot Token</label><input id="token" type="password" autocomplete="off" placeholder="Вставьте Token от @BotFather"></div><button id="test">🧪 Проверить бота</button><button id="save">💾 Сохранить подключение</button><div id="status" class="status">⚪ Бот ещё не проверен</div><p class="warning">🔒 Token не хранится в URL. Для реального безопасного сохранения подключите backend/Secret.</p></main><script>const $=id=>document.getElementById(id);async function test(){const t=$('token').value.trim();if(!t)return $('status').textContent='🔴 Сначала вставьте Token';$('status').textContent='⏳ Проверяем…';try{const r=await fetch('https://api.telegram.org/bot'+encodeURIComponent(t)+'/getMe');const j=await r.json();$('status').textContent=j.ok?'🟢 Бот подключён: @'+j.result.username:'🔴 Token недействителен';}catch(e){$('status').textContent='🔴 Не удалось проверить Token';}}$('test').onclick=test;$('save').onclick=()=>{if(!$('token').value.trim())return $('status').textContent='🔴 Введите Token';$('status').textContent='🟡 Проверка прошла. Безопасное сохранение требует backend Secret.';};</script></body></html>
